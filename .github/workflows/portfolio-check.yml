name: Portfolio preview build check
on:
  pull_request:
    paths:
      - 'src/**'
      - 'package*.json'
      - '.github/workflows/portfolio-check.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
